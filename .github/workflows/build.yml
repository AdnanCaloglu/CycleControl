name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify project
        run: mvn --batch-mode clean verify
